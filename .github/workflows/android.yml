name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optionnel : clé Gemini pour le chat IA (secret du dépôt GEMINI_API_KEY).
      # Sans elle, l'appli fonctionne avec les réponses hors-ligne.
      - name: Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env.example ]; then echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env; fi

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MinnaNihongo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinnaNihongo-apk
          path: MinnaNihongo.apk

      - name: Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MinnaNihongo.apk
